<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="45%" stop-color="#141a24"/>
      <stop offset="70%" stop-color="#2a2325"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1613"/>
      <stop offset="35%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="goldMist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c5a059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2330"/>
      <stop offset="100%" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161519"/>
      <stop offset="100%" stop-color="#0c0b0d"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Distant Scottish Highland Peaks -->
  <polygon points="0,520 220,380 480,470 760,320 1020,440 1280,310 1480,410 1600,350 1600,600 0,600" fill="url(#mountainGrad1)" opacity="0.85"/>

  <!-- Highland Mist Layer -->
  <ellipse cx="800" cy="480" rx="900" ry="120" fill="url(#goldMist)" filter="url(#mistBlur)"/>

  <!-- Foreground Crags & Castle Silhouette -->
  <polygon points="0,580 180,480 340,560 520,460 680,550 780,510 820,440 820,410 840,410 840,440 870,450 1050,560 1220,470 1420,550 1600,490 1600,660 0,660" fill="url(#mountainGrad2)"/>

  <!-- Loch Water Surface -->
  <rect y="640" width="1600" height="260" fill="url(#waterGrad)"/>

  <!-- Golden Water Reflections -->
  <path d="M720,640 Q800,680 880,640 T1040,650 Q800,720 560,650 Z" fill="#c5a059" opacity="0.18" filter="url(#mistBlur)"/>
  <ellipse cx="800" cy="740" rx="400" ry="25" fill="#c5a059" opacity="0.12" filter="url(#mistBlur)"/>

  <!-- Subtle Celtic Geometric Accent in Sky -->
  <g opacity="0.15" stroke="#c5a059" stroke-width="1.5" fill="none">
    <circle cx="800" cy="240" r="120"/>
    <circle cx="800" cy="240" r="85"/>
    <line x1="800" y1="90" x2="800" y2="390"/>
    <line x1="650" y1="240" x2="950" y2="240"/>
  </g>

  <!-- Editorial Vignette Overlay -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
